{% extends "base.html" %}{% block title %}Log in – Laundrix{% endblock %}
{% block content %}<div class="container py-5" style="max-width:480px">
<h1 class="h2 mb-4">Log in</h1>
<form class="panel" data-auth="/auth/login" novalidate>
  <div class="alert alert-danger d-none" data-alert role="alert"></div>
  <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div>
  <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
  <div class="mb-3 text-end"><a href="/forgot">Forgot password?</a></div>
  <button class="btn btn-lx w-100" type="submit">Log in</button>
  <p class="mt-3 mb-0 text-center">New here? <a href="/register">Create an account</a></p>
</form></div>{% endblock %}
