{% extends "base.html" %}{% block title %}Dashboard – Laundrix{% endblock %}
{% block content %}<div class="container py-5">
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
  <h1 class="h2 mb-0">Hello, {{ current_user.full_name.split()[0] }}</h1>
  <a class="btn btn-lx" href="/book">Book laundry</a></div>
<div class="row g-4"><div class="col-lg-8">
  <h2 class="h5 mb-3">Your bookings</h2>
  <div id="booking-list"><div class="panel">Loading your bookings…</div></div></div>
<div class="col-lg-4">
  <div class="d-flex justify-content-between"><h2 class="h5 mb-3">Notifications</h2><button id="mark-read" class="btn btn-sm btn-link">Mark all read</button></div>
  <div id="notif-list" class="panel mb-4 small">Loading…</div>
  <h2 class="h5 mb-3">Report a problem</h2>
  <form id="complaint-form" class="panel" novalidate>
    <div class="alert d-none" data-alert role="alert"></div>
    <textarea class="form-control mb-2" name="message" rows="3" maxlength="1000" placeholder="What went wrong? Include your booking reference." aria-label="Complaint"></textarea>
    <button class="btn btn-lx btn-sm" type="submit">Send complaint</button>
    <div id="complaint-list" class="small mt-3"></div>
  </form></div></div>
</div>{% endblock %}
